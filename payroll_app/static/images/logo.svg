<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Accent Mint/Cyan Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Gold Accent Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.25" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Badge -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Glass Border Highlight -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="26.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Layered Payroll Card -->
  <rect x="28" y="26" width="64" height="68" rx="14" fill="#064e3b" fill-opacity="0.25" transform="rotate(-6 60 60)" />

  <!-- Foreground Payroll Card Surface -->
  <rect x="26" y="24" width="68" height="72" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Dynamic Financial Curves: "E" and "P" Intertwined & Rupee / Currency Notch -->
  <!-- Upper Curve of "P" / Currency Fold -->
  <path d="M 40 38 L 64 38 C 73 38 80 44 80 52 C 80 60 73 66 64 66 L 53 66" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vertical Pillar of Payroll Advice -->
  <line x1="42" y1="38" x2="42" y2="82" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Horizontal Center Bar / Speed Line (representing "Easy") -->
  <line x1="42" y1="52" x2="62" y2="52" 
        stroke="url(#glowGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Lower Base Foot / Growth Tick -->
  <path d="M 42 82 L 72 82" 
        stroke="#ffffff" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- Checkmark / Growth Wave across the bottom right -->
  <path d="M 58 74 L 68 84 L 84 68" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Modern Financial Accent Spark / Diamond Star -->
  <path d="M 83 26 Q 83 34 89 34 Q 83 34 83 42 Q 83 34 77 34 Q 83 34 83 26 Z" 
        fill="url(#goldGrad)" />
</svg>
