<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="fullGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#fullBgGrad)" />
    <rect x="1" y="1" width="58" height="58" rx="15" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />
    
    <!-- Stylized EP Glyphs -->
    <path d="M 21 17 L 36 17 C 42 17 46 21 46 27 C 46 33 42 37 36 37 L 27 37" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="22" y1="17" x2="22" y2="43" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="22" y1="43" x2="38" y2="43" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 33 35 L 40 42 L 49 31" fill="none" stroke="url(#fullGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: EasyPayroll -->
  <text x="84" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Easy<tspan fill="url(#brandTextGrad)">Payroll</tspan>
  </text>
  
  <!-- Sub-tagline -->
  <text x="85" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.5" text-transform="uppercase">
    Stress-Free Attendance &amp; Payroll
  </text>
</svg>
