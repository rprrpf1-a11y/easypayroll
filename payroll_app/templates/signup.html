{% extends "base.html" %}

{% block title %}Sign Up - EasyPayroll{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        <div class="text-center mb-6">
            <a href="{{ url_for('index') }}" class="inline-block mb-3">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="EasyPayroll Logo" class="w-14 h-14 mx-auto drop-shadow-md hover:scale-105 transition-transform">
            </a>
            <h2 class="text-2xl font-bold text-slate-900">Create Free Account</h2>
            <p class="text-sm text-slate-500 mt-1">Start managing your team's payroll in under 1 minute</p>
        </div>

        <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1" for="name">Your Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="name" name="name" required placeholder="John Doe"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1" for="company_name">Company / Organization</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-building"></i>
                    </span>
                    <input type="text" id="company_name" name="company_name" placeholder="Acme Studios"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1" for="email">Work Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" name="email" required placeholder="john@acme.com"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1" for="currency">Currency</label>
                    <select id="currency" name="currency" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 font-semibold text-slate-800">
                        <option value="₹" selected>₹ (INR)</option>
                        <option value="$">$ (USD)</option>
                        <option value="€">€ (EUR)</option>
                        <option value="£">£ (GBP)</option>
                        <option value="AED">AED (Dirham)</option>
                        <option value="C$">C$ (CAD)</option>
                        <option value="A$">A$ (AUD)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1" for="password">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
                </div>
                <p class="text-xs text-slate-400 mt-1">Must be at least 6 characters</p>
            </div>

            <button type="submit" class="w-full mt-2 py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md shadow-emerald-200 transition-all hover:shadow-lg focus:outline-none">
                Create Free Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="font-semibold text-brand-600 hover:underline">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
